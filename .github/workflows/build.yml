name: Build Moodeoa Smart APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "MoodeoaAndroid-Beta.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MoodeoaAndroid-Beta.zip was not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 4 -type f | sort

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Create JVM compatibility configuration
        shell: bash
        run: |
          cat > "$PROJECT_DIR/force-jvm.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("kotlin")) {
                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Creating Gradle wrapper..."

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew
          fi

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --init-script force-jvm.gradle

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moodeoa-Smart-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
