name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project Files
        run: |
          if [ -f "MoodeoaAndroid-Beta.zip" ]; then
            unzip -o MoodeoaAndroid-Beta.zip -d extracted
            TARGET=$(find extracted -name "settings.gradle*" -exec dirname {} \;)
            echo "Moving files from $TARGET"
            cp -r $TARGET/. .
          fi

      - name: Setup Gradle Wrapper
        run: gradle wrapper

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME -Dkotlin.compiler.jvmTarget=1.8 --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moodeoa-Smart-App
          path: app/build/outputs/apk/debug/app-debug.apk
