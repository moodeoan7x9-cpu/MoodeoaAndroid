name: Build Moodeoa Smart APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "MoodeoaAndroid-Beta.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: MoodeoaAndroid-Beta.zip not found"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          echo "Extracted files:"
          find android-project -maxdepth 5 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Set Gradle version to 8.9
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            sed -i -E \
              's#gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-(all|bin)\.zip#gradle-8.9-all.zip#g' \
              gradle/wrapper/gradle-wrapper.properties

          else

            echo "Gradle wrapper properties not found."
            echo "Creating Gradle wrapper using Gradle 8.9."

            gradle wrapper --gradle-version 8.9

          fi

          chmod +x ./gradlew

          echo "===== Gradle Wrapper ====="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "===== Gradle Version ====="
          ./gradlew --version

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Fix old Java targets
          text = text.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          text = text.replace(
              "JavaVersion.VERSION_11",
              "JavaVersion.VERSION_17"
          )

          # Fix old Kotlin JVM targets
          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          text = text.replace(
              'jvmTarget = "11"',
              'jvmTarget = "17"'
          )

          text = text.replace(
              "jvmTarget = '11'",
              "jvmTarget = '17'"
          )

          # Add Java 17 compile options if they do not exist
          if "compileOptions" not in text and "android {" in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  1
              )

          # Add Kotlin 17 configuration if not already present
          if "jvmTarget = " not in text:
              text += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Java/Kotlin JVM target fixed to 17.")
          PY

          echo "===== Final app/build.gradle ====="
          cat "$BUILD_FILE"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== APK FILES ====="

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moodeoa-Smart-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found:
